<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Host an event · aftermeet</title>
<link rel="stylesheet" href="/style.css" />
<style>
  main { max-width: 560px; margin: 0 auto; padding: 40px 28px 80px; }
  .form-stack > * + * { margin-top: 22px; }
  #status { margin-top: 16px; text-align: center; font-size: 14px; }
  #status .err { color: var(--danger); }
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="brand"><span class="brand-dot"></span>aftermeet</a>
</nav>

<main class="rise">
  <div class="eyebrow" style="margin-bottom: 8px;">HOST MODE</div>
  <h1 class="heading">Create the event page</h1>
  <p class="muted" style="margin: 14px 0 36px;">Paste your event URL. We pull the title, image, time, and location from the page.</p>

  <form id="hostForm" class="form-stack">
    <div>
      <label class="label" for="eventUrl">Event URL</label>
      <input id="eventUrl" class="input" type="url" required
             placeholder="https://cerebralvalley.ai/e/... or https://lu.ma/..." />
      <p class="hint">Cerebral Valley · Luma · most public event pages</p>
    </div>

    <div>
      <label class="label" for="hostProfile">Your profile link <span class="dim">(optional)</span></label>
      <input id="hostProfile" class="input" type="url"
             placeholder="linkedin.com/in/you · x.com/you · your-site.com" />
    </div>

    <button id="submitBtn" type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
      Create event page →
    </button>
  </form>

  <div id="status"></div>
</main>

<script>
const form = document.getElementById('hostForm');
const btn = document.getElementById('submitBtn');
const statusEl = document.getElementById('status');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  let eventUrl = document.getElementById('eventUrl').value.trim();
  const hostProfile = document.getElementById('hostProfile').value.trim();
  if (eventUrl && !/^https?:\/\//i.test(eventUrl)) eventUrl = 'https://' + eventUrl;

  btn.disabled = true;
  btn.textContent = 'Parsing event…';
  statusEl.textContent = '';

  try {
    const res = await fetch('/api/events', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ eventUrl, hostProfile })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    window.location.href = `/e/${data.slug}/screen`;
  } catch (err) {
    statusEl.innerHTML = '<span class="err">' + err.message + '</span>';
    btn.disabled = false;
    btn.textContent = 'Create event page →';
  }
});
</script>
</body>
</html>
