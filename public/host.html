<!DOCTYPE html>
<html lang="en" data-locale="auto">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-i18n="title">Host an event · aftermeet</title>
<link rel="stylesheet" href="/style.css" />
<style>
  main { max-width: 560px; margin: 0 auto; padding: 40px 28px 80px; }
  .form-stack > * + * { margin-top: 22px; }
  #status { margin-top: 16px; text-align: center; font-size: 14px; }
  #status .err { color: var(--danger); }
  .lang-switch { display: inline-flex; gap: 4px; font-size: 11px; }
  .lang-switch a { padding: 4px 8px; border-radius: 6px; text-decoration: none; color: var(--text-dim); }
  .lang-switch a.on { background: var(--bg-elev); color: var(--accent-hi); }
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="brand"><span class="brand-dot"></span>aftermeet</a>
  <span class="lang-switch">
    <a href="?lang=ko" data-lang="ko">KO</a>
    <a href="?lang=en" data-lang="en">EN</a>
  </span>
</nav>

<main class="rise">
  <div class="eyebrow" style="margin-bottom: 8px;" data-i18n="eyebrow">HOST MODE</div>
  <h1 class="heading" data-i18n="heading">Create the event page</h1>
  <p class="muted" style="margin: 14px 0 36px;" data-i18n="lede">Paste your event URL. We pull the title, image, time, and location from the page.</p>

  <form id="hostForm" class="form-stack">
    <div>
      <label class="label" for="eventUrl" data-i18n="urlLabel">Event URL</label>
      <input id="eventUrl" class="input" type="url" required
             data-i18n-placeholder="urlPh"
             placeholder="https://cerebralvalley.ai/e/... or https://lu.ma/..." />
      <p class="hint" data-i18n="urlHint">Cerebral Valley · Luma · most public event pages</p>
    </div>

    <div>
      <label class="label" for="hostProfile" data-i18n="profileLabel">Your profile link (optional)</label>
      <input id="hostProfile" class="input" type="url"
             data-i18n-placeholder="profilePh"
             placeholder="linkedin.com/in/you · x.com/you · your-site.com" />
    </div>

    <button id="submitBtn" type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" data-i18n="submit">
      Create event page →
    </button>
  </form>

  <div id="status"></div>
</main>

<script src="/i18n.js"></script>
<script>
const I18N = {
  ko: {
    title: '행사 만들기 · aftermeet',
    eyebrow: '호스트 모드',
    heading: '행사 페이지를 만들어볼까요',
    lede: '행사 URL을 붙여넣으세요. 페이지에서 제목, 이미지, 시간, 장소를 자동으로 가져옵니다.',
    urlLabel: '행사 URL',
    urlPh: 'https://cerebralvalley.ai/e/... 또는 https://lu.ma/...',
    urlHint: 'Cerebral Valley · Luma · 대부분의 공개 행사 페이지',
    profileLabel: '본인 프로필 링크 (선택)',
    profilePh: 'linkedin.com/in/you · x.com/you · 본인 사이트',
    submit: '행사 페이지 만들기 →',
    parsing: '행사 정보를 가져오는 중…',
  },
  en: {
    title: 'Host an event · aftermeet',
    eyebrow: 'HOST MODE',
    heading: 'Create the event page',
    lede: 'Paste your event URL. We pull the title, image, time, and location from the page.',
    urlLabel: 'Event URL',
    urlPh: 'https://cerebralvalley.ai/e/... or https://lu.ma/...',
    urlHint: 'Cerebral Valley · Luma · most public event pages',
    profileLabel: 'Your profile link (optional)',
    profilePh: 'linkedin.com/in/you · x.com/you · your-site.com',
    submit: 'Create event page →',
    parsing: 'Parsing event…',
  },
};
applyI18n(I18N);

const form = document.getElementById('hostForm');
const btn = document.getElementById('submitBtn');
const statusEl = document.getElementById('status');
const locale = detectLocale();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  let eventUrl = document.getElementById('eventUrl').value.trim();
  const hostProfile = document.getElementById('hostProfile').value.trim();
  if (eventUrl && !/^https?:\/\//i.test(eventUrl)) eventUrl = 'https://' + eventUrl;

  btn.disabled = true;
  btn.textContent = I18N[locale].parsing;
  statusEl.textContent = '';

  try {
    const res = await fetch('/api/events', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ eventUrl, hostProfile })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    window.location.href = `/e/${data.slug}/screen`;
  } catch (err) {
    statusEl.innerHTML = '<span class="err">' + err.message + '</span>';
    btn.disabled = false;
    btn.textContent = I18N[locale].submit;
  }
});
</script>
</body>
</html>
